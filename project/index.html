    <!-- Fecha a tela de carregamento: espera a página carregar e no mínimo 2,6 segundos para a animação aparecer inteira -->
    <script>
    (function () {
        var tela = document.getElementById("carregamento");
        if (!tela) { return; }

        /* Já viu a animação nesta sessão (ex.: voltou de outra tela): remove na hora */
        var jaViu = false;
        try { jaViu = !!sessionStorage.getItem("carregamentoVisto"); } catch (e) {}
        if (jaViu) {
            tela.parentNode.removeChild(tela);
            document.body.classList.remove("carregando");
            return;
        }
        try { sessionStorage.setItem("carregamentoVisto", "1"); } catch (e) {}

        var reduzMovimento = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var tempoMinimo = reduzMovimento ? 800 : 2600;
        var jaSaiu = false;

        function sair() {
            if (jaSaiu) { return; }
            jaSaiu = true;
            tela.classList.add("saindo");

            setTimeout(function () {
                if (tela.parentNode) { tela.parentNode.removeChild(tela); }
                document.body.classList.remove("carregando");
            }, reduzMovimento ? 350 : 1100);
        }

        function esperarTempoMinimo() {
            var jaPassou = (window.performance && performance.now) ? performance.now() : 0;
            setTimeout(sair, Math.max(0, tempoMinimo - jaPassou));
        }

        if (document.readyState === "complete") {
            esperarTempoMinimo();
        } else {
            window.addEventListener("load", esperarTempoMinimo);
        }

        /* Garantia: se algo demorar demais, abre o site depois de 7 segundos */
        setTimeout(sair, 7000);
    })();
    </script>
